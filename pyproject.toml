[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotpin"
version = "1.0.0a7"
description = "Slot-pinning, KV-warmth-preserving reverse proxy with a priority scheduler and metrics dashboard for llama.cpp (llama-server / llama-swap) and the Gufo engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "headbouyJB" }]
keywords = ["llama.cpp", "llm", "proxy", "kv-cache", "local-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Environment :: No Input/Output (Daemon)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = []  # stdlib-only at runtime, by design

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/headbouyJB/slotpin"
Repository = "https://github.com/headbouyJB/slotpin"
Issues = "https://github.com/headbouyJB/slotpin/issues"

[project.scripts]
slotpin = "slotpin.cli:main"
slotpin-proxy = "slotpin.cli:main"
slotpin-dash = "slotpin.dash:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
