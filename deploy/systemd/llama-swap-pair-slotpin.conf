# systemd drop-in for llama-swap.service.
# Install as: /etc/systemd/system/llama-swap.service.d/pair-slotpin.conf
# Then: systemctl daemon-reload
#
# Pairing rule: any restart of the llama-swap *unit* must be
# followed by a restart of slotpin-proxy. Without this, the proxy's inferred
# cache-ram pool and per-slot occupant map (slot_last) go stale relative to
# the now-reset upstream model state -- every turn looks "warm" to the proxy
# when it isn't, which silently suppresses the restore that turn actually
# needs, producing a full cold prefill (the incident class this rule exists
# to prevent).
#
# Scope note: this drop-in only covers restarts of the llama-swap systemd
# *unit*. It does NOT cover llama-swap's own internal behaviour -- its
# periodic (~2s) poll of its own config file, or an in-place model swap via
# its /upstream mechanism -- because neither of those restarts the unit, so
# ExecStartPost never fires for them. That path is instead covered by
# slotpin-proxy's own built-in reset-on-reload detector (reload_detect.py),
# which independently polls the upstream llama-server's /props for a
# monotonic-signature regression (model path/name, uptime/start-time,
# cumulative counters) and clears the pool + slot_last itself when it fires.
# No manual action is needed for that case -- see docs/operations.md.

[Service]
ExecStartPost=-+systemctl --no-block restart slotpin-proxy
