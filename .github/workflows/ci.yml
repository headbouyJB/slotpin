name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The dashboard page-script tests use Node and skip when it is absent.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install package (dev extras)
        run: python -m pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q -p no:cacheprovider

      - name: Smoke - llama-server example config
        run: slotpin-proxy --config config.example.toml --check

      - name: Smoke - Gufo example config
        run: slotpin-proxy --config config.example.gufo.toml --check

      - name: Syntax-check install script
        run: bash -n deploy/install.sh
